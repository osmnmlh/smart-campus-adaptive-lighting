[platformio]
default_envs = native

[env]
lib_ldf_mode = deep+
lib_deps =
  smart-campus-wire=symlink://../shared

[env:native]
platform = native
test_framework = unity
test_build_src = no
extra_scripts = pre:../gateway/scripts/native_toolchain.py
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Werror
  -static
  -static-libgcc
  -static-libstdc++

[node_esp32]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
lib_deps =
  ${env.lib_deps}
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -D CORE_DEBUG_LEVEL=1
monitor_speed = 115200

[env:node1-ci]
extends = node_esp32
build_flags =
  ${node_esp32.build_flags}
  -D SC_LAB_BUILD=1
  -D SMART_CAMPUS_NODE_ID=1

[env:node2-ci]
extends = node_esp32
lib_deps =
  ${node_esp32.lib_deps}
  claws/BH1750@1.3.0
  adafruit/Adafruit INA219@1.2.3
build_flags =
  ${node_esp32.build_flags}
  -D SC_LAB_BUILD=1
  -D SMART_CAMPUS_NODE_ID=2

[env:node3-ci]
extends = node_esp32
build_flags =
  ${node_esp32.build_flags}
  -D SC_LAB_BUILD=1
  -D SMART_CAMPUS_NODE_ID=3

[env:node1-field]
extends = node_esp32
build_flags =
  ${node_esp32.build_flags}
  -D SC_FIELD_BUILD=1
  -D SMART_CAMPUS_NODE_ID=1

[env:node2-field]
extends = node_esp32
lib_deps =
  ${node_esp32.lib_deps}
  claws/BH1750@1.3.0
  adafruit/Adafruit INA219@1.2.3
build_flags =
  ${node_esp32.build_flags}
  -D SC_FIELD_BUILD=1
  -D SMART_CAMPUS_NODE_ID=2

[env:node3-field]
extends = node_esp32
build_flags =
  ${node_esp32.build_flags}
  -D SC_FIELD_BUILD=1
  -D SMART_CAMPUS_NODE_ID=3
