[platformio]
default_envs = native

[env]
lib_ldf_mode = deep+
lib_deps =
  smart-campus-wire=symlink://../shared

[env:native]
platform = native
test_framework = unity
test_build_src = no
extra_scripts = pre:scripts/native_toolchain.py
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Werror
  -static
  -static-libgcc
  -static-libstdc++

[esp32]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
lib_deps =
  ${env.lib_deps}
  bblanchon/ArduinoJson@7.4.3
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -D CORE_DEBUG_LEVEL=1
monitor_speed = 115200

[env:esp32dev-ci]
extends = esp32
build_flags =
  ${esp32.build_flags}
  -D SC_LAB_BUILD=1

[env:esp32dev-field]
extends = esp32
build_flags =
  ${esp32.build_flags}
  -D SC_FIELD_BUILD=1
