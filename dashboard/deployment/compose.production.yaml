name: ${COMPOSE_PROJECT_NAME:-smart-campus}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  traefik:
    image: traefik:v3.7.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.mqtts.address=:8883
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --accesslog=true
      - --log.level=INFO
    ports:
      - target: 80
        published: '80'
        protocol: tcp
        mode: host
      - target: 443
        published: '443'
        protocol: tcp
        mode: host
      - target: 8883
        published: '8883'
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/letsencrypt
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  frontend:
    image: ${COMPOSE_PROJECT_NAME:-smart-campus}-frontend:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deployment/frontend.Dockerfile
      args:
        NEXT_PUBLIC_DASHBOARD_DATA_MODE: ${NEXT_PUBLIC_DASHBOARD_DATA_MODE:-live}
        NEXT_PUBLIC_BACKEND_HTTP_URL: ${NEXT_PUBLIC_BACKEND_HTTP_URL:-}
        NEXT_PUBLIC_BACKEND_WS_URL: ${NEXT_PUBLIC_BACKEND_WS_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COMPOSE_PROJECT_NAME:-smart-campus}_edge
      - traefik.http.routers.frontend.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.priority=1
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt
      - traefik.http.services.frontend.loadbalancer.server.port=3000
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  backend:
    image: ${COMPOSE_PROJECT_NAME:-smart-campus}-backend:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deployment/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
    environment:
      NODE_ENV: production
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: '3001'
      CORS_ORIGINS: https://${APP_DOMAIN}
      WEBSOCKET_PATH: /ws/v1
      WEBSOCKET_ALLOWED_ORIGINS: https://${APP_DOMAIN}
      MQTT_ENABLED: 'true'
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      MQTT_CLIENT_ID: ${BACKEND_MQTT_CLIENT_ID:-smart-campus-backend}
      MQTT_USERNAME: ${BACKEND_MQTT_USERNAME:-backend_ingest}
      MQTT_PASSWORD: ${BACKEND_MQTT_PASSWORD:?Set BACKEND_MQTT_PASSWORD}
      MQTT_CONNECT_TIMEOUT_MS: ${MQTT_CONNECT_TIMEOUT_MS:-5000}
      MQTT_RECONNECT_PERIOD_MS: ${MQTT_RECONNECT_PERIOD_MS:-1000}
      MQTT_KEEPALIVE_SECONDS: ${MQTT_KEEPALIVE_SECONDS:-30}
      MQTT_MAX_PAYLOAD_BYTES: ${MQTT_MAX_PAYLOAD_BYTES:-16384}
      MQTT_DEDUP_CAPACITY: ${MQTT_DEDUP_CAPACITY:-10000}
      MQTT_LIVENESS_SWEEP_MS: ${MQTT_LIVENESS_SWEEP_MS:-5000}
    networks:
      - edge
      - internal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COMPOSE_PROJECT_NAME:-smart-campus}_edge
      - traefik.http.routers.backend.rule=Host(`${APP_DOMAIN}`) && (PathPrefix(`/api/v1`) || Path(`/health`) || PathPrefix(`/ws/v1`))
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.priority=100
      - traefik.http.routers.backend.tls=true
      - traefik.http.routers.backend.tls.certresolver=letsencrypt
      - traefik.http.services.backend.loadbalancer.server.port=3001
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ${MQTT_PASSWORD_FILE_PATH:-./secrets/mosquitto/passwords}:/mosquitto/config/passwords:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - edge
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - kill -0 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COMPOSE_PROJECT_NAME:-smart-campus}_edge
      - traefik.tcp.routers.mqtts.rule=HostSNI(`${MQTT_DOMAIN}`)
      - traefik.tcp.routers.mqtts.entrypoints=mqtts
      - traefik.tcp.routers.mqtts.tls=true
      - traefik.tcp.routers.mqtts.tls.certresolver=letsencrypt
      - traefik.tcp.services.mqtts.loadbalancer.server.port=1883
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  edge:
    name: ${COMPOSE_PROJECT_NAME:-smart-campus}_edge
  internal:
    name: ${COMPOSE_PROJECT_NAME:-smart-campus}_internal
    internal: true

volumes:
  traefik_acme:
    name: ${COMPOSE_PROJECT_NAME:-smart-campus}_traefik_acme
  mosquitto_data:
    name: ${COMPOSE_PROJECT_NAME:-smart-campus}_mosquitto_data
