name: Gateway and node firmware

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/gateway-firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/gateway-firmware.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install platformio==6.1.19
      - run: pio test -d firmware/gateway -e native
      - run: pio run -d firmware/gateway -e esp32dev-ci
      - run: pio run -d firmware/gateway -e esp32dev-tls-ci
      - run: pio test -d firmware/node -e native
      - run: pio run -d firmware/node -e node1-ci
      - run: pio run -d firmware/node -e node2-ci
      - run: pio run -d firmware/node -e node3-ci
